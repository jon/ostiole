name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: v1.7.7
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.6.0
  MARKDOWNLINT_VERSION: 0.23.2
  STATICCHECK_VERSION: v0.7.0

jobs:
  policy:
    if: ${{ github.event_name == 'pull_request' }}
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the proposed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check commits and pull-request metadata
        run: >-
          go run ./internal/ci/checkpr
          -base "$BASE_SHA"
          -head "$HEAD_SHA"
          -event "$GITHUB_EVENT_PATH"

  commits:
    if: ${{ github.event_name == 'pull_request' }}
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the proposed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test every pull-request commit
        shell: bash
        run: |
          temporary_root=$(mktemp -d)
          worktree="${temporary_root}/commit"
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$worktree" 2>/dev/null || true
            rmdir "$temporary_root" 2>/dev/null || true
          }
          trap cleanup EXIT

          while read -r commit; do
            echo "Testing ${commit}"
            git worktree add --detach "$worktree" "$commit"
            (
              cd "$worktree"
              unformatted=$(gofmt -l .)
              if [[ -n "$unformatted" ]]; then
                echo "Files require gofmt:"
                echo "$unformatted"
                exit 1
              fi
              go build ./...
              go vet ./...
              go test -race ./...
            )
            git worktree remove --force "$worktree"
          done < <(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the final tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "Files require gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run Staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          staticcheck ./...
      - name: Run production-code lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run --config .golangci.yml ./...
      - name: Run test-code lint
        run: golangci-lint run --config .golangci.tests.yml ./...
      - name: Lint tracked Markdown
        shell: bash
        run: |
          markdown_files=()
          while IFS= read -r -d '' file; do
            markdown_files+=("$file")
          done < <(git ls-files -z '*.md')
          npx --yes "markdownlint-cli2@${MARKDOWNLINT_VERSION}" -- "${markdown_files[@]}"
      - name: Lint workflows
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          actionlint
      - name: Scan Go dependencies for vulnerabilities
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  macos:
    name: macos (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out the final tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Compile integration tests
        run: go test -tags=integration -run '^$' ./...
      - name: Check native C formatting
        run: >-
          xcrun clang-format --dry-run --Werror
          usb/iokit_darwin.c usb/iokit_darwin.h
      - name: Check native C diagnostics
        run: >-
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only
          usb/iokit_darwin.c

  codex-reviewed:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    name: codex-reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Wait for Codex to review the current head
        shell: bash
        run: |
          post_head_timeline() {
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/timeline?per_page=100" | \
              jq -c '
                add
                | to_entries as $timeline
                | ($timeline | map(select(
                    (.value.event == "head_ref_force_pushed" and .value.commit_id == env.HEAD_SHA)
                    or (.value.event == "committed" and .value.sha == env.HEAD_SHA)
                  )) | last | .key) as $head_index
                | if $head_index == null then []
                  else [$timeline[] | select(.key > $head_index) | .value]
                  end
              '
          }

          clean_review_prefixes() {
            jq -r '.[] | select(
              .event == "commented"
              and .user.login == "chatgpt-codex-connector[bot]"
              and (.body // "" | startswith("Codex Review: Didn\u0027t find any major issues."))
            ) | try (.body | capture("\\*\\*Reviewed commit:\\*\\* `(?\u003cprefix\u003e[0-9a-f]{7,40})`").prefix) catch empty' \
              <<< "$post_head_entries"
          }

          clean_comment_review() {
            while read -r reviewed_commit; do
              if [[ ! "$reviewed_commit" =~ ^[0-9a-f]{7,40}$ ]]; then
                continue
              fi
              resolved_sha=$(gh api \
                "repos/${GH_REPO}/commits/${reviewed_commit}" \
                --jq '.sha' 2>/dev/null || true)
              if [[ "$resolved_sha" == "$HEAD_SHA" ]]; then
                return 0
              fi
            done < <(clean_review_prefixes)
            return 1
          }

          previous_gate() {
            while read -r candidate_run_id; do
              if [[ ! "$candidate_run_id" =~ ^[0-9]+$ ]]; then
                continue
              fi
              gate_count=$(gh api \
                --paginate \
                --slurp \
                "repos/${GH_REPO}/actions/runs/${candidate_run_id}/jobs?filter=all&per_page=100" | \
                jq '[.[] | .jobs[] | select(.name == "codex-reviewed" and .conclusion == "success")] | length')
              if [[ "$gate_count" -gt 0 ]]; then
                return 0
              fi
            done < <(gh api \
              --paginate \
              "repos/${GH_REPO}/actions/workflows/test.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" | \
              jq -r ".workflow_runs[] | select(
                .id != (${RUN_ID} | tonumber) and
                .path == \".github/workflows/test.yml\" and
                .event == \"pull_request\" and
                .head_sha == \"${HEAD_SHA}\" and
                any(.pull_requests[]?; .number == (${PR_NUMBER} | tonumber))
              ) | .id")
            return 1
          }

          for attempt in {1..60}; do
            if previous_gate; then
              echo "A prior Codex gate already validated ${HEAD_SHA}."
              exit 0
            fi

            review_count=$(gh api \
              --paginate \
              --slurp \
              "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" | \
              jq "add | [.[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .commit_id == \"${HEAD_SHA}\" and .state != \"PENDING\" and .state != \"DISMISSED\" and (.body // \"\" | contains(\"Codex Security Review\") | not))] | length")
            if [[ "$review_count" -gt 0 ]]; then
              echo "Codex completed a review of ${HEAD_SHA}."
              exit 0
            fi

            post_head_entries=$(post_head_timeline)
            if clean_comment_review; then
              echo "Codex completed a clean review of ${HEAD_SHA}."
              exit 0
            fi

            echo "Waiting for Codex review of ${HEAD_SHA} (${attempt}/60)."
            sleep 20
          done
          echo "Codex did not complete a review of ${HEAD_SHA}."
          exit 1
