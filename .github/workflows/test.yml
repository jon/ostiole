name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    env:
      GOLANGCI_LINT_VERSION: v2.12.2
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      STATICCHECK_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
      - run: staticcheck ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - run: golangci-lint run --config .golangci.yml ./...
      - run: golangci-lint run --config .golangci.tests.yml ./...
      - run: xcrun clang-format --dry-run --Werror usb/iokit_darwin.c usb/iokit_darwin.h
      - run: clang -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only usb/iokit_darwin.c
