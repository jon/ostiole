name: request Copilot review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    if: ${{ !github.event.pull_request.draft }}
    name: request Copilot review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # This privileged workflow deliberately does not check out or evaluate
      # any content from the pull request.
      #
      # COPILOT_REVIEW_TOKEN is an optional fine-grained personal access token
      # restricted to this repository with Pull requests: write. Its owner
      # must be able to use Copilot code review. The default GITHUB_TOKEN is
      # attempted first because it is a GitHub App installation token with
      # the required repository permission.
      #
      # Missing or expired fallback credentials deliberately fail this job
      # after GitHub rejects GITHUB_TOKEN. That failure is a maintenance alarm:
      # without a successful request, the exact-head Copilot review gate cannot
      # pass. Each successful synchronize request can start a separately
      # metered review; this is intentional so every pushed head is reviewed.
      - name: Request Copilot as a reviewer
        env:
          FALLBACK_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRIMARY_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          request_review() {
            GH_TOKEN="$1" gh api --method POST \
              "repos/${GH_REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
          }

          if request_review "$PRIMARY_TOKEN"; then
            exit 0
          fi
          if [[ -z "$FALLBACK_TOKEN" ]]; then
            echo "GitHub rejected the automated request and no fallback token is configured."
            exit 1
          fi

          echo "GitHub rejected the automated request; retrying with the fallback token."
          request_review "$FALLBACK_TOKEN"
