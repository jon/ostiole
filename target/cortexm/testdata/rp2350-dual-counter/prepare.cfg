source [find interface/jlink.cfg]
transport select swd
adapter serial 000802011345
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap rp2350 cpu -expected-id 0x4c013477
dap create rp2350.dap -chain-position rp2350.cpu -adiv6
target create rp2350.core0 cortex_m -dap rp2350.dap -ap-num 0x2000
target create rp2350.core1 cortex_m -dap rp2350.dap -ap-num 0x4000

proc require_inactive_cti {} {
    foreach address {0xe0042000 0xe0042014 0xe0042134 0xe0042138 0xe0042f00} {
        if {[lindex [read_memory $address 32 1] 0] != 0} {
            error "Inherited CTI is active; refusing bench preparation"
        }
    }
    for {set i 0} {$i < 8} {incr i} {
        foreach base {0xe0042020 0xe00420a0} {
            if {[lindex [read_memory [expr {$base + 4*$i}] 32 1] 0] != 0} {
                error "Inherited CTI routing is present; refusing bench preparation"
            }
        }
    }
    if {[lindex [read_memory 0xe0042140 32 1] 0] != 15} {
        error "Require default inherited CTI gate"
    }
    echo [mdw 0xe0042000]
    echo [mdw 0xe0042140]
    echo [mdw 0xe000ee08]
}

proc require_secure_bank {} {
    set domain [lindex [read_memory 0xe000ee08 32 1] 0]
    if {($domain & 0x10000) == 0 || ($domain & 3) == 1} {
        error "Require Secure execution and debugger bank selection"
    }
    if {([lindex [read_memory 0xe000edf0 32 1] 0] & 0x00100000) == 0} {
        error "Require Secure invasive debug permission"
    }
}

init
foreach core {rp2350.core0 rp2350.core1} {
    targets $core
    require_inactive_cti
    require_secure_bank
}
targets rp2350.core0
if {([lindex [read_memory 0x40018004 32 1] 0] & 0x01000000) != 0} {
    error "Core 1 is held in reset; refusing to release inherited reset"
}
mww 0x4001a004 0x01000000
if {([lindex [read_memory 0x40018004 32 1] 0] & 0x01000000) == 0} {
    error "Core 1 reset assertion unconfirmed"
}
mww 0x4001b004 0x01000000
sleep 20
foreach core {rp2350.core0 rp2350.core1} {
    targets $core
    halt
}
targets rp2350.core0
load_image /tmp/ostiole-rp2350-dual-counter.bin 0x20040000 bin
set expected {
    0x00000000 0x00000000 0x00000000 0x00000000
    0x00000000 0x00000000 0x00000000 0x00000000
    0x4902b672 0x30012000 0xe7fc6008 0x20040000
    0x00000000 0x00000000 0x00000000 0x00000000
    0x00000000 0x00000000 0x00000000 0x00000000
    0x00000000 0x00000000 0x00000000 0x00000000
    0x4902b672 0x30012000 0xe7fc6008 0x20040004
}
foreach core {rp2350.core0 rp2350.core1} {
    targets $core
    foreach got [read_memory 0x20040000 32 28] want $expected {
        if {$got != $want} {
            error "RAM image verification failed"
        }
    }
}
echo "Both RAM counter images loaded and verified through both MEM-APs"
foreach {core start} {rp2350.core0 0x20040020 rp2350.core1 0x20040060} {
    targets $core
    if {$core eq "rp2350.core1"} {
        require_secure_bank
        echo "Core 1 boot MPU control before RAM entry: [mdw 0xe000ed94]"
        mww 0xe000ed94 0
        reg msp_s 0x20043000
    }
    reg primask 1
    echo "Configured interrupt mask: [reg primask]"
    echo "Inherited security control: [reg control_s]"
    reg pc $start
    reg xpsr 0x01000000
    resume
    mww 0xe000edf0 0xa05f0000
    echo [mdw 0xe000edf0]
}
echo "Both counters running with halting debug disabled; CTI unchanged"
shutdown
