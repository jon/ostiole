source [find interface/jlink.cfg]
transport select swd
adapter serial 000802011345
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap rp2350 cpu -expected-id 0x4c013477
dap create rp2350.dap -chain-position rp2350.cpu -adiv6
target create rp2350.core0 cortex_m -dap rp2350.dap -ap-num 0x2000 -work-area-phys 0x20041000 -work-area-size 0x1000 -work-area-backup 1
init
halt
load_image /tmp/ostiole-rp2350-counter.elf
verify_image /tmp/ostiole-rp2350-counter.elf
echo "RAM counter loaded and verified"
mdw 0x20040020 4
reg pc 0x20040020
reg xpsr 0x01000000
resume
mww 0xe000edf0 0xa05f0000
mdw 0xe000edf0
echo "Counter running with halting debug disabled"
shutdown
